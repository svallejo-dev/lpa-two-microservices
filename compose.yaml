name: lpa-microservicios

services:
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${USERS_DB_USER:-users_app}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-users_secret}
    volumes:
      - users_db_data:/var/lib/postgresql/data
      - ./services/users-service/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [users-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${USERS_DB_USER:-users_app} -d ${USERS_DB_NAME:-users_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  users-service:
    build:
      context: ./services/users-service
      target: runtime
    environment:
      DATABASE_URL: postgres://${USERS_DB_USER:-users_app}:${USERS_DB_PASSWORD:-users_secret}@users-db:5432/${USERS_DB_NAME:-users_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${USERS_SERVICE_PORT:-8001}:8000"
    networks: [users-data, services]
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders_db}
      POSTGRES_USER: ${ORDERS_DB_USER:-orders_app}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_secret}
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./services/orders-service/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [orders-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ORDERS_DB_USER:-orders_app} -d ${ORDERS_DB_NAME:-orders_db}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  orders-service:
    build:
      context: ./services/orders-service
      target: runtime
    environment:
      DATABASE_URL: postgres://${ORDERS_DB_USER:-orders_app}:${ORDERS_DB_PASSWORD:-orders_secret}@orders-db:5432/${ORDERS_DB_NAME:-orders_db}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://users-service:8000}
      USER_DIRECTORY_TIMEOUT_MS: ${USER_DIRECTORY_TIMEOUT_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${ORDERS_SERVICE_PORT:-8002}:8000"
    networks: [orders-data, services]
    depends_on:
      orders-db:
        condition: service_healthy
      users-service:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  users-data:
    internal: true
  orders-data:
    internal: true
  services:

volumes:
  users_db_data:
  orders_db_data:
